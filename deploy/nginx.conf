server {
  listen 8080;
  root /usr/share/nginx/html;

  # En-têtes de sécurité : rien n'est chargé hors de l'origine, pas d'incrustation dans un autre site.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;   # flux SSE
  }
  location / {
    try_files $uri /index.html;
  }
}
