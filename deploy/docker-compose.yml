# Développement et petites installations. Aucune valeur secrète ici : tout vient de deploy/.env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?défini dans deploy/.env}
      POSTGRES_DB: harness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}

  # IdP OIDC de test uniquement. Son émetteur est http://dex:5556/dex : pour s'y connecter depuis un
  # navigateur, ajouter « 127.0.0.1 dex » à /etc/hosts. En production : l'IdP de l'organisation.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?défini dans deploy/.env}
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      # Deux rôles : le propriétaire exécute les migrations ; l'application se connecte avec un rôle
      # sans SUPERUSER ni BYPASSRLS, soumis à l'isolation par groupe.
      MIGRATION_DATABASE_URL: postgresql+psycopg://harness:${POSTGRES_PASSWORD}@postgres:5432/harness
      DATABASE_URL: postgresql+psycopg://harness_app:${HARNESS_APP_PASSWORD:?défini dans deploy/.env}@postgres:5432/harness
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  pgdata:
  ollama:
